[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "normativa-madrid"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
description = "La normativa educativa de Madrid como fuente de datos fiable para agentes: texto literal, códigos estables y procedencia de cada elemento"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
normativa-madrid = "normativa_madrid.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]
mantenimiento = ["pdfplumber"]

[tool.hatch.build.targets.wheel]
packages = ["src/normativa_madrid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
